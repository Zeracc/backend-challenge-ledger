name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: wagering
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PASSWORD: wagering
      POSTGRES_PORT: 5432
      POSTGRES_USER: wagering
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      SQS_ENDPOINT: http://127.0.0.1:4566
    services:
      localstack:
        image: localstack/localstack:4.8.1
        env:
          SERVICES: sqs
        ports:
          - 4566:4566
        options: >-
          --health-cmd "awslocal sqs list-queues"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: wagering
          POSTGRES_PASSWORD: wagering
          POSTGRES_USER: wagering
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wagering -d wagering"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Protect database logs from test payloads
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U wagering -d wagering \
            -c "ALTER SYSTEM SET log_min_messages = 'fatal'" \
            -c "ALTER SYSTEM SET log_min_error_statement = 'panic'" \
            -c "ALTER SYSTEM SET log_error_verbosity = 'terse'" \
            -c "ALTER SYSTEM SET log_parameter_max_length = '0'" \
            -c "ALTER SYSTEM SET log_parameter_max_length_on_error = '0'" \
            -c "SELECT pg_reload_conf()"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Check types
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Validate Docker Compose
        run: docker compose config --quiet
